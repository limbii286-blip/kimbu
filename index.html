#app{max-width:480px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.card{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:20px 18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(120,40,70,.12),0 2px 6px rgba(120,40,70,.06)}
h1{margin:16px 0;text-align:center;font-weight:400;font-family:"Lilita One","Baloo 2",sans-serif;font-size:42px;line-height:1.15;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.5px #16325c;paint-order:stroke fill;text-shadow:0 3px 0 #16325c,0 6px 14px rgba(10,25,60,.45)}
h1.logo{font-family:"Lilita One","Baloo 2",sans-serif;font-weight:400;letter-spacing:3px;line-height:1.05;font-size:clamp(48px,15vw,70px);transform:rotate(-1.5deg);margin:clamp(14px,3.5svh,30px) 0 clamp(12px,3svh,26px);color:#fff;-webkit-text-stroke:2px #16325c;paint-order:stroke fill;text-shadow:0 4px 0 #16325c,0 8px 16px rgba(10,25,60,.5);padding:0 8px}
h2{font-size:19px;margin:0 0 10px;font-weight:900;letter-spacing:.2px}
p{color:var(--mu);line-height:1.5;margin:6px 0;font-size:15px}
input{width:100%;padding:15px;border-radius:16px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:800 18px "Nunito",sans-serif;margin:5px 0;text-align:center;text-transform:uppercase;letter-spacing:5px;outline:none;transition:border-color .15s}
input:focus{border-color:var(--bo)}
button{width:100%;padding:15px;border:0;border-radius:16px;font:800 17px "Nunito",sans-serif;letter-spacing:.3px;background:linear-gradient(135deg,#e64980,#c2255c);color:#fff;margin-top:10px;cursor:pointer;box-shadow:0 6px 16px rgba(214,51,108,.3),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .1s,box-shadow .15s}
button:active{transform:translateY(2px) scale(.99);box-shadow:0 2px 8px rgba(0,0,0,.15)}
button.alt{background:#fff;color:var(--tx);border:2px solid var(--bd);box-shadow:0 3px 10px rgba(120,40,70,.08)}
button.b{background:linear-gradient(135deg,#e64980,#c2255c)}button.g{background:linear-gradient(135deg,#4c6ef5,#364fc7);box-shadow:0 6px 16px rgba(59,91,219,.3),inset 0 1px 0 rgba(255,255,255,.25)}button.y{background:linear-gradient(135deg,#9775fa,#6741d9);box-shadow:0 6px 16px rgba(123,92,240,.3)}
button:disabled{opacity:.45;box-shadow:none;cursor:default}button.me{outline:4px solid #ffd43b;outline-offset:2px}
.vs{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;margin:6px 0}
.vs.home{margin:clamp(8px,2.5svh,22px) 0 0}
.vs img{grid-row:1;width:100%;min-width:0;aspect-ratio:5/7;max-height:36vh;max-height:36svh;object-fit:cover;border-radius:22px;border:4px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.vs .l{grid-column:1;transform:rotate(-3deg)}.vs .r{grid-column:3;transform:rotate(3deg)}
.vs.sm{margin:2px 0 0}.vs.sm{grid-template-columns:auto 46px auto;justify-content:center}.vs.sm img{width:auto;aspect-ratio:3/4;max-height:none;height:clamp(90px,19vh,160px);border-width:3px;border-radius:16px}.vs.sm span{font-size:24px;-webkit-text-stroke:2px #2a1620}
h1.sm{font-size:32px}
button.op{background:#fff4f7;color:var(--tx);border:2px solid #f7c6d4;box-shadow:0 3px 10px rgba(214,51,108,.1);transition:background .15s,color .15s,transform .15s}
button.op.on{background:linear-gradient(135deg,#ff6b8b,#e8144f);color:#fff;border-color:#e8144f;box-shadow:0 6px 18px rgba(232,20,79,.45);transform:scale(1.03)}
button.op:disabled{opacity:.8}
.vs span{grid-column:2;grid-row:1;justify-self:center;align-self:center;position:relative;z-index:2;margin:0;line-height:1;font-size:36px;font-weight:900;color:#fff;-webkit-text-stroke:3px #2a1620;paint-order:stroke fill;text-shadow:0 0 18px #ff3b6b,0 0 30px #3b5bdb,0 5px 0 #2a1620;transform:rotate(-8deg);animation:pu 1.2s infinite alternate}
@keyframes pu{to{transform:rotate(-8deg) scale(1.12)}}
.tn{display:flex;align-items:center;gap:10px;margin-bottom:6px}.tn img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.tag{font-weight:900;font-size:12px;letter-spacing:1.6px;color:var(--mu);text-align:center}
.q{font-size:22px;font-weight:900;line-height:1.3;text-align:center;margin:6px 0 10px}.qs{font-size:15px;font-weight:700;text-align:center;color:var(--mu);margin:2px 0 10px}
.tm{font-size:54px;font-weight:900;text-align:center;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}.tm.lo{color:var(--no)}
.pb{height:10px;background:#f8e6ec;border-radius:99px;overflow:hidden;margin:10px 0 14px}.pb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#e64980,#9c36b5);transition:width .2s linear}
.bx{padding:13px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.1);margin-top:8px;font-weight:700;text-align:center;color:#fff}.bx.ok{background:var(--ok)}.bx.no{background:var(--no)}
.sc{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;border-top:1px dashed var(--bd);font-size:19px;font-weight:900}.sc:first-of-type{border-top:0}
.er{color:var(--no);font-size:14px;margin-top:6px}.win{width:100%;border-radius:24px;border:5px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
select{width:100%;padding:14px;border-radius:16px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:700 17px "Nunito",sans-serif}
.halo{position:relative;isolation:isolate;width:fit-content;max-width:100%;margin:0 auto}
.vs{isolation:isolate}
.edt{text-align:center;font-family:"Lilita One","Baloo 2",sans-serif;font-size:clamp(16px,5vw,22px);letter-spacing:3px;text-transform:uppercase;line-height:1.1;color:#cfe0ff;margin:-4px 0 clamp(10px,2.5svh,22px);text-shadow:0 2px 0 #16325c,0 4px 10px rgba(10,25,60,.45);transform:rotate(-1.5deg)}

 try{var r=await ref(B()+"/roles/"+id).transaction(function(c){return c?undefined:uid});
  if(r.committed&&old&&old!==id)ref(B()+"/roles/"+old).remove()}catch(e){fe(e)}
}
function allRoles(){return RL.s&&RL.v&&RL.m&&RL.a&&RL.y}
function startGame(){
 if(!allRoles())return;
 var ord=QS.map(function(_,i){return i});for(var i=ord.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ord[i];ord[i]=ord[j];ord[j]=t}
 ref(B()+"/m").update({phase:"play",r:0,dur:QDUR,endsAt:now()+QDUR*1000,win:null,ord:ord});
}
async function resetGame(){
 try{await ref(B()+"/a").remove();await ref(B()+"/v").remove();await ref(B()+"/m").update({phase:"lobby",r:0,endsAt:0,dur:null,win:null,ord:null})}catch(e){fe(e)}
}
function leave(){
 if(code){ref(B()+"/m").off();ref(B()+"/roles").off();ref(B()+"/a").off();ref(B()+"/v").off()}
 try{localStorage.removeItem("gc2")}catch(e){}
 code="";joined=false;G=null;RL={};A=[];V={};err="";lastKey="";early="";cfOn=false;
 render();
}
async function restartGame(){
 if(!host())return;
 if(!confirm("Emin misin? Oyun tamamen kapanacak ve herkes ana ekrana dönecek. Tüm puanlar, roller ve cevaplar silinecek."))return;
 var p=B();
 try{await ref(p+"/m").update({phase:"closed"});await ref(p).remove()}catch(e){}
 leave();
}
function playAgain(){
 if(!host())return;
 if(!confirm("Emin misin? Yeni oyun lobisi açılacak."))return;
 early="";cfOn=false;resetGame();
}
function pick(id){var m=myRole();if(!m||R[m].sp||G.phase!=="play"||over())return;ref(B()+"/a/"+G.r+"_"+m).set({r:G.r,role:m,pick:id})}
function vote(t){
 var m=myRole();if(!m||!R[m].sp||G.phase!=="vote")return;
 if(over()&&V[m])return;
 ref(B()+"/v/"+m).set(t);
}
/* bir takımın r. sorudaki sonucu */
function res(r,t){var a=A.filter(function(x){return x.r===r&&x.role===T[t].p})[0],p=a?a.pick:null;return{p:p,ok:p!==null&&p===Q(r).a}}
function scores(upTo){var s={t:0,i:0};for(var r=0;r<=upTo&&r<N;r++)["t","i"].forEach(function(t){if(res(r,t).ok)s[t]++});return s}
function curScore(){return scores(over()?G.r:G.r-1)}
function tally(){var c={t:0,i:0};SPEC.forEach(function(id){if(V[id]==="t"||V[id]==="i")c[V[id]]++});return c}
function missing(){return SPEC.filter(function(id){return !V[id]})}
function nextQ(){
 if(!host()||G.r>=N-1)return;
 ref(B()+"/m").update({r:G.r+1,dur:QDUR,endsAt:now()+QDUR*1000});
}
/* son soru bittikten sonra sonuçlar birkaç saniye görünsün, sonra otomatik ilerle */
function autoNext(){
 if(G.r<N-1||now()<G.endsAt+5000)return;
 var k=code+":"+G.r+":"+G.endsAt;if(autoK===k)return;autoK=k;
 var s=scores(G.r),tie=s.t===s.i,r=G.r;
 ref(B()+"/m").transaction(function(m){
  if(!m||m.phase!=="play"||m.r!==r)return;
  if(tie){m.phase="vote";m.dur=VDUR;m.endsAt=now()+VDUR*1000}else m.phase="end";
  return m;
 });
}
function autoVote(){
 var tl=tally();if(tl.t===tl.i||now()<G.endsAt+800)return;
 var w=tl.t>tl.i?"t":"i",k=code+":vote:"+G.endsAt+":"+w;if(autoK===k)return;autoK=k;
 ref(B()+"/m").transaction(function(m){if(!m||m.phase!=="vote")return;m.phase="end";m.win=w;return m});
}
function VS(c){return '<div class="vs'+c+'">'+pic("t","l")+'<span>VS</span>'+pic("i","r")+'</div>'}
function hostBtns(){return host()?'<button class="alt" style="margin-top:18px" onclick="restartGame()">Baştan Başla</button>':''}
function rank(s){
 var mx=Math.max(s.t,s.i),l=["t","i"].sort(function(x,y){return s[y]-s[x]});
 return l.map(function(t){return '<div class="sc"><span>'+(s[t]===mx?'👑':'🥀')+' '+esc(T[t].n)+'</span><span>'+s[t]+'</span></div>'}).join('');
}
function box(r,t){
 var x=res(r,t),p=R[T[t].p].n,tx=x.p===null?p+" cevap vermedi":p+" "+R[x.p].acc+" seçti";
 return '<div class="bx '+(x.ok?'ok':'no')+'">'+esc(tx)+'</div>';
}
function opts(t,dis){
 var m=myRole(),a=A.filter(function(x){return x.r===G.r&&x.role===m})[0];
 return OPT.map(function(id){return '<button class="op'+(!dis&&a&&a.pick===id?' on':'')+'"'+(dis?' disabled':'')+' onclick="pick(\''+id+'\')">'+esc(R[id].n)+'</button>'}).join('');
}
function lobby(){
 var m=myRole();
 var h='<div class="card" style="text-align:center"><div class="tag">OYUN KODU</div><div style="font-size:44px;font-weight:900;letter-spacing:8px;color:var(--bo)">'+esc(code)+'</div><p>Arkadaşların bu kodla katılsın, sonra herkes rolünü seçsin.</p></div>';
 ["t","i"].forEach(function(t){
  var id=T[t].p,o=RL[id],mine=o===uid;
  h+='<div class="card"><div class="tn">'+pic(t)+'<h2 style="margin:0">'+esc(T[t].n)+' Takımı</h2></div><button class="'+T[t].c+(mine?' me':'')+'"'+(o&&!mine?' disabled':'')+' onclick="claim(\''+id+'\')">'+esc(R[id].n)+(mine?' (sen)':(o?' (dolu)':' ol'))+'</button></div>';
 });
 h+='<div class="card"><h2>İzleyiciler</h2>'+SPEC.map(function(id){
  var o=RL[id],mine=o===uid;return '<button class="y'+(mine?' me':'')+'"'+(o&&!mine?' disabled':'')+' onclick="claim(\''+id+'\')">'+esc(R[id].n)+(mine?' (sen)':(o?' (dolu)':' ol'))+'</button>'}).join('')+'</div>';
 if(host())h+='<button onclick="startGame()"'+(allRoles()?'':' disabled')+'>Oyunu Başlat ('+N+' soru)</button>'+(allRoles()?'':'<p style="text-align:center">Başlamak için beş rolün de seçilmiş olması gerekir.</p>');
 else h+='<p style="text-align:center">Oyunu kuran kişinin başlatması bekleniyor...</p>';
 return h;
}
function play(){
 var lab='SORU '+(G.r+1)+' / '+N,m=myRole(),mt=m&&!R[m].sp?R[m].t:null,ov=over(),h="";
 if(!ov){
  var left=Math.max(0,Math.ceil((G.endsAt-now())/1000));
  h='<div class="card"><div class="tag">'+lab+'</div><div class="tm'+(left<=5?' lo':'')+'" id="tm">'+left+'</div><div class="pb"><i id="bar" style="width:'+Math.min(100,(G.endsAt-now())/((G.dur||QDUR)*10))+'%"></i></div><div class="q">'+esc(Q(G.r).q)+'</div>';
  if(mt)h+=opts(mt,false);
  else h+='<p style="text-align:center">İzleyici olarak izliyorsun, işaretleyemezsin.</p><div class="tag" style="margin-top:10px">ŞIKLAR</div>'+opts("t",true);
  h+='</div>';
 }else{
  h='<div class="card"><div class="tag">'+lab+' · SÜRE DOLDU</div><div class="qs">'+esc(Q(G.r).q)+'</div><div class="bx" style="background:#2a1620">Doğru cevap: '+esc(R[Q(G.r).a].n)+'</div>'+["t","i"].map(function(t){return '<div class="tn" style="margin-top:12px">'+pic(t)+'<b>'+esc(T[t].n)+'</b></div>'+box(G.r,t)}).join('')+'</div><div class="card"><h2>Puan durumu</h2>'+rank(curScore())+'</div>';
  if(G.r>=N-1)h+='<p style="text-align:center">Sonuç geliyor...</p>';
  else h+=host()?'<button onclick="nextQ()">Sonraki Soru</button>':'<p style="text-align:center">Sonraki soruyu oyunu kuran kişi açacak.</p>';
 }
 return h+hostBtns();
}
function chips(){
 return '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px">'+SPEC.map(function(id){var d=!!V[id];return '<span style="padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px;background:'+(d?'#1fa971':'#f3d3dd')+';color:'+(d?'#fff':'#8a6b77')+'">'+esc(R[id].n)+(d?' ✓':' …')+'</span>'}).join('')+'</div>';
}
function voteBtns(){
 var m=myRole(),mine=V[m],can=m&&R[m].sp&&(!over()||!V[m]);
 return ["t","i"].map(function(t){return '<button class="'+T[t].c+(mine===t?' me':'')+'"'+(can?'':' disabled')+' onclick="vote(\''+t+'\')">Takım '+esc(T[t].n)+'</button>'}).join('');
}
function voteScr(){
 var m=myRole(),isV=m&&R[m].sp;
 if(!over()){
  var left=Math.max(0,Math.ceil((G.endsAt-now())/1000));
  return '<h1 class="sm">Oylama bekleniyor...</h1>'+VS(' sm')+'<div class="card" style="margin-top:14px"><div class="tag">BERABERE · OYLAMA</div><div class="tm'+(left<=5?' lo':'')+'" id="tm">'+left+'</div><div class="pb"><i id="bar" style="width:'+Math.min(100,(G.endsAt-now())/((G.dur||VDUR)*10))+'%"></i></div>'+
   (isV?'<div class="q">Sence hangi takım kazansın?</div>'+voteBtns():'<p style="text-align:center">Berabere kaldınız! Kazananı Mustafa, Samet ve Yiğitalp oylayarak belirliyor.</p>')+chips()+'</div>'+hostBtns();
 }
 var tl=tally();
 if(tl.t!==tl.i)return '<h1 class="sm">Oylar sayılıyor...</h1>'+VS(' sm')+'<div class="card" style="margin-top:14px">'+rank(tl)+'</div>'+hostBtns();
 var ms=missing(),names=ms.map(function(id){return R[id].gen}).join(" ve ");
 if(ms.indexOf("y")>=0){
  var oth=ms.filter(function(id){return id!=="y"}).map(function(id){return R[id].n}).join(" ve ");
  return '<h1 class="sm">Yiğitalp’i bekliyoruz,<br>oyla artık!</h1><img class="win" style="display:block;max-width:300px;margin:12px auto 0" src="'+IMG.yg+'" onerror="fb(this,\'yg\')" alt="">'+(oth?'<p style="text-align:center;margin-top:12px">'+esc(oth)+' da henüz oy vermedi.</p>':'')+(m==="y"?'<div class="card" style="margin-top:14px"><div class="q">Oylar eşit, sıra sende!</div>'+voteBtns()+'</div>':'<p style="text-align:center;margin-top:14px">Oylar eşit olduğu için kazanan henüz belli değil.</p>')+hostBtns();
 }
 var ph1='<div class="card" style="text-align:center;margin-top:14px"><div style="font-size:64px;line-height:1">⏳</div>'+ms.map(function(id){return '<div style="font-family:Lilita One,Baloo 2,sans-serif;font-weight:400;font-size:clamp(44px,14vw,64px);line-height:1.1;color:var(--bo)">'+esc(R[id].n)+'</div>'}).join('')+'</div>';
 var mine=m&&ms.indexOf(m)>=0;
 return '<h1 class="sm">'+esc(names)+' oylamasını bekliyoruz!</h1>'+ph1+(mine?'<div class="card"><div class="q">Oylar eşit, sıra sende!</div>'+voteBtns()+'</div>':'<p style="text-align:center;margin-top:14px">Oylar eşit olduğu için kazanan henüz belli değil.</p>')+hostBtns();
}
function end(){
 var s=scores(N-1),t=G.win||(s.t>s.i?"t":"i"),h;
 h='<h1>Tebrikler!<br>Takım '+esc(T[t].n)+' kazandı!</h1>'+pic(t,"win");
 h+='<div class="card" style="margin-top:14px"><h2>Final skoru</h2>'+rank(s)+'</div>';
 if(G.win)h+='<div class="card"><h2>Oylama sonucu</h2>'+rank(tally())+'</div>';
 return h+(host()?'<button onclick="playAgain()">Tekrar Oyna</button><button class="alt" onclick="restartGame()">Baştan Başla</button>':'<p style="text-align:center">Yeni oyunu oyunu kuran kişi açacak.</p>');
}
function render(){
 var h="",E=err?'<div class="er">'+esc(err)+'</div>':'';
 if(!joined){
  if(document.activeElement&&document.activeElement.id==="cd")return;
  h=VS(' home')+'<div class="halo"><h1 class="logo">Kim bu?</h1><div class="edt">Zübeyde Hanım Edition</div></div><button onclick="enter(true)">Oyun Kur</button><div class="card" style="margin-top:14px"><input id="cd" placeholder="OYUN KODU" maxlength="6"><button class="alt" onclick="enter(false)">Oyuna Katıl</button>'+E+'</div>';
 }else if(!G)h='<div class="card"><p>Oyun yükleniyor...</p>'+E+'</div>';
 else if(G.phase==="lobby"){h=lobby()+E;cfOn=false;early=""}
 else if(G.phase==="vote")h=voteScr();
 else if(G.phase==="end"){h=end();if(!cfOn){cfOn=true;confetti()}}
 else h=play();
 app.innerHTML=h;
}
setInterval(function(){
 if(!joined||!G||(G.phase!=="play"&&G.phase!=="vote"))return;
 var ov=over();
 if(!ov){
  var all=G.phase==="play"?["s","v"].every(function(id){return A.some(function(x){return x.r===G.r&&x.role===id})}):SPEC.every(function(id){return !!V[id]}),ek=code+G.phase+G.r;
  if(all&&early!==ek&&G.endsAt-now()>FAST*1000){early=ek;ref(B()+"/m/endsAt").transaction(function(v){return v-now()>FAST*1000?now()+FAST*1000:undefined})}
 }else if(G.phase==="play")autoNext();else autoVote();
 var k=G.phase+":"+G.r+":"+ov;
 if(k!==lastKey){lastKey=k;render();return}
 var t=document.getElementById("tm");if(t){var l=Math.max(0,Math.ceil((G.endsAt-now())/1000));t.textContent=l;t.className="tm"+(l<=5?" lo":"");var b=document.getElementById("bar");if(b)b.style.width=Math.min(100,Math.max(0,(G.endsAt-now())/((G.dur||QDUR)*10)))+"%"}
},200);
function confetti(){
 var c=document.getElementById("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 var cols=["#d6336c","#3b5bdb","#ffd43b","#1fa971","#7b5cf0","#ff922b"],P=[];
 for(var i=0;i<170;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height,w:6+Math.random()*7,h:9+Math.random()*9,v:2+Math.random()*4,s:Math.random()*2-1,a:Math.random()*6,c:cols[i%6]});
 var st=Date.now();
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.y+=p.v;p.x+=p.s*2;p.a+=.1;if(p.y>c.height&&Date.now()-st<9000){p.y=-10;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(Date.now()-st<12000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
try{var sc=localStorage.getItem("gc2");if(db&&sc){ref("games/"+sc+"/m").once("value").then(function(s){if(s.exists())sub(sc);else render()})}}catch(e){}
render();
</script>
</body>
</html>
